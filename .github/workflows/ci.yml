# CI runs the exact same path a developer runs locally: lint, bring up the
# real Postgres+pgvector container via docker compose, run the smoke test.
# No mocked database — if the schema or an operator breaks, CI goes red.
#
# Later phases extend this with eval gates: leak rate must be exactly 0,
# and retrieval metrics must not regress, or the build fails.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      # The access policy is pure functions over plain data, so it tests
      # without a database or the corpus. It also runs first: if the policy
      # is wrong, nothing downstream is worth checking.
      - name: Policy tests
        run: uv run pytest -q

      - name: Start database
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Smoke test (real database, no mocks)
        run: uv run python scripts/smoke_test.py

      - name: Fetch corpus
        run: uv run python scripts/fetch_corpus.py

      - name: Seed
        run: uv run python scripts/seed.py

      - name: Policy sanity (no persona sees everything or nothing)
        run: uv run python scripts/access_matrix.py

      # The SQL enforcement path and the reference implementation must admit
      # exactly the same documents for every persona. Two implementations of
      # one policy is a liability until proven otherwise.
      - name: SQL and Cypher policies match the reference implementation
        run: uv run python scripts/verify_policy_parity.py

      # Fourth implementation of the same policy, as a relationship graph.
      # Every one of them must admit exactly what the oracle admits, or the
      # answer a user gets depends on which code path happened to run.
      - name: OpenFGA policy matches the reference implementation
        run: |
          uv run python scripts/load_authz.py
          uv run python scripts/authz_benchmark.py

      # Every attack that ever worked is a permanent regression test. A
      # breach fails the build; a documented open risk does not, because
      # pretending it is closed would be worse than recording it.
      - name: Red team
        run: |
          uv run python scripts/index_corpus.py
          uv run python scripts/build_graph.py
          uv run python scripts/redteam.py

      # Runs the real application, not a mock: startup, dependency wiring,
      # database and graph all live. Asserts that a persona never receives a
      # document above their clearance through any endpoint.
      - name: API behaves correctly for every persona
        run: uv run python scripts/api_smoke.py

      # The golden dataset is committed. Rebuilding it here must reproduce
      # the committed file byte for byte — if generation drifts, eval numbers
      # from different phases stop being comparable and the whole results
      # table becomes fiction.
      - name: Golden dataset is deterministic
        run: |
          uv run python scripts/build_goldens.py
          git diff --exit-code -- eval/goldens.jsonl

      # Calibration: the harness must report total leakage for a retriever
      # that ignores permissions, and a clean sweep for one that cannot fail.
      - name: Eval harness calibration
        run: uv run python scripts/evaluate.py
