# CI runs the same path a developer runs locally, against real services.
# Nothing is mocked: if the schema, an operator, the policy or the API
# breaks, the build goes red before anyone notices by accident.
#
# Ordered in two halves — build everything, then verify everything. An
# earlier version interleaved them and a verification step ran before the
# graph it checks had been built, which reported a missing build step as a
# catastrophic policy failure.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      # Pure functions over plain data — no services needed, and if the
      # policy or the scorer is wrong, nothing downstream is worth checking.
      - name: Unit tests
        run: uv run pytest -q

      # --- build ------------------------------------------------------

      - name: Start services
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Smoke test (real database, no mocks)
        run: uv run python scripts/smoke_test.py

      - name: Fetch corpus
        run: uv run python scripts/fetch_corpus.py

      - name: Seed
        run: uv run python scripts/seed.py

      - name: Index corpus
        run: uv run python scripts/index_corpus.py

      - name: Build knowledge graph
        run: uv run python scripts/build_graph.py

      - name: Load authorization tuples
        run: uv run python scripts/load_authz.py

      # --- verify -----------------------------------------------------

      - name: Policy sanity (no persona sees everything or nothing)
        run: uv run python scripts/access_matrix.py

      # One policy, four implementations. Every one must admit exactly what
      # the reference implementation admits, or the answer a user gets
      # depends on which code path happened to run.
      - name: SQL and Cypher policies match the reference implementation
        run: uv run python scripts/verify_policy_parity.py

      - name: OpenFGA policy matches the reference implementation
        run: uv run python scripts/authz_benchmark.py

      # The golden dataset is committed. Rebuilding must reproduce it byte
      # for byte, or results from different phases stop being comparable.
      - name: Golden dataset is deterministic
        run: |
          uv run python scripts/build_goldens.py
          git diff --exit-code -- eval/goldens.jsonl

      # The harness must report total leakage for a retriever that ignores
      # permissions, and a clean sweep for one that cannot fail.
      - name: Eval harness calibration
        run: uv run python scripts/evaluate.py

      # Every attack that ever worked is a permanent regression test.
      - name: Red team
        run: uv run python scripts/redteam.py

      # Runs the real application — startup, dependency wiring, database and
      # graph all live. Asserts no persona receives a document above their
      # clearance through any endpoint.
      - name: API behaves correctly for every persona
        run: uv run python scripts/api_smoke.py
