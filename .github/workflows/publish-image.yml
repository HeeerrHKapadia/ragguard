# Publish the self-contained image to GitHub Container Registry.
#
# The image carries Postgres, pgvector, 4,996 pre-computed embeddings, the
# knowledge-graph-free search path and the demo UI. `docker run` and it
# works — no database to provision, no corpus to download, no API key, no
# configuration.
#
# Free in every direction: GHCR hosts public images at no cost, and Actions
# minutes are unmetered on public repositories. The fifteen-minute build is
# paid for once per release rather than by whoever runs it.
#
# Not on every push — the build embeds the whole corpus, and doing that for a
# README typo would be rude to the runners even when it is free.

name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is minted for this run. No secret to configure, and
      # nothing to leak.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/space/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image actually serves
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name verify -p 7860:7860 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7860/api/health > /dev/null; then break; fi
            sleep 3
          done
          curl -sf http://localhost:7860/api/health | tee /tmp/health.json
          # A published image that starts but holds no corpus is worse than a
          # failed build, because it looks fine until someone searches.
          grep -q '"chunks":4996' /tmp/health.json
          docker rm -f verify
