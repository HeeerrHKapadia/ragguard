# Fly.io configuration. `fly launch` will offer to rewrite this — decline,
# because the settings below are chosen rather than inferred.

app = "ragguard"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  POSTGRES_PORT = "5432"
  EMBEDDING_MODEL = "BAAI/bge-small-en-v1.5"
  EMBEDDING_DIM = "384"
  FASTEMBED_CACHE_PATH = "/opt/models"

[http_service]
  internal_port = 8080
  force_https = true

  # A demo is idle almost all the time. Stopping the machine when nothing is
  # happening is the difference between a few dollars a month and a few
  # cents; the cost is a slow first request after a quiet period.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

# Embedding a query runs an ONNX model in-process, so this needs real memory.
# 256MB is not enough and the failure looks like a mysterious restart loop.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[checks.health]
  type = "http"
  port = 8080
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
