# Phase 0a: just Postgres + pgvector.
# Qdrant, OpenFGA and Langfuse get added in later phases, when a failing
# metric actually demands them. Don't add services you can't yet justify.

name: ragguard

services:
  postgres:
    # Official pgvector image = Postgres 17 with the `vector` extension
    # precompiled. Building it yourself is a rite of passage you can skip.
    image: pgvector/pgvector:pg17
    container_name: ragguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragguard_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-ragguard}
    ports:
      # Host 5433, not 5432 — so this never collides with a Postgres you
      # might install natively later. Container-internal is still 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # NAMED VOLUME for data, not a bind mount to a Windows folder.
      # Bind-mounting the Postgres data dir on Windows causes permission
      # and fsync problems. Config files below are bind-mounted read-only,
      # which is fine because they're small and never written to.
      - pgdata:/var/lib/postgresql/data
      # Everything in here runs ONCE, in filename order, on first startup
      # of an empty volume. `docker compose down -v` wipes and re-runs it.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Compose marks the service healthy only when Postgres actually
      # accepts connections — "container started" != "database ready".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragguard} -d ${POSTGRES_DB:-ragguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    # The knowledge graph. Added in Phase 4, once there was a measured
    # baseline for it to be compared against — the whole project rests on
    # the graph having to earn its place rather than being assumed into it.
    image: neo4j:5-community
    container_name: ragguard-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ragguard_dev_pw}
      # Community edition allows one database, so tenants are separated by
      # a property on every node and relationship rather than by database.
      # That is a deliberate constraint to design against: it means tenant
      # isolation has to hold inside every single query.
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7475}:7474"    # browser UI
      - "${NEO4J_BOLT_PORT:-7688}:7687"    # driver protocol
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  openfga:
    # Zanzibar-style authorization, the model Google uses for Drive and
    # YouTube permissions. Added in Phase 7 to replace three hand-written
    # policy implementations with one service that owns the decision.
    image: openfga/openfga:latest
    container_name: ragguard-openfga
    restart: unless-stopped
    command: run
    environment:
      # In-memory storage: the tuples are rebuilt from Postgres on every run,
      # so durability here would only create a second source of truth able to
      # drift from the first.
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_LEVEL: warn
    ports:
      - "${OPENFGA_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  qdrant:
    # Added last, to test one specific claim: that applying permission
    # filters *during* HNSW traversal avoids the throughput collapse
    # measured in Phase 2, where a selective WHERE halved pgvector's rate.
    image: qdrant/qdrant:latest
    container_name: ragguard-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6335}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
