[project]
name = "ragguard"
version = "0.1.0"
description = "Permission-aware RAG: retrieval that respects who is asking."
requires-python = ">=3.13"

# Phase 0a deps only. Embeddings, LLM clients, eval frameworks and the API
# layer get added in the phases that actually need them — a requirements
# file that installs everything on day one teaches you nothing about what
# each piece is for.
dependencies = [
    "psycopg[binary]>=3.2",   # Postgres driver. [binary] ships prebuilt wheels.
    "pgvector>=0.4",          # Registers the `vector` type with psycopg.
    "python-dotenv>=1.0",     # Loads .env so secrets stay out of source.
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragguard"]
