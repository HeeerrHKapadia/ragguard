[project]
name = "ragguard"
version = "0.1.0"
description = "Permission-aware RAG: retrieval that respects who is asking."
requires-python = ">=3.13"

# Phase 0a deps only. Embeddings, LLM clients, eval frameworks and the API
# layer get added in the phases that actually need them — a requirements
# file that installs everything on day one teaches you nothing about what
# each piece is for.
dependencies = [
    "psycopg[binary]>=3.2",   # Postgres driver. [binary] ships prebuilt wheels.
    "pgvector>=0.4",          # Registers the `vector` type with psycopg.
    "python-dotenv>=1.0",     # Loads .env so secrets stay out of source.
    "pyyaml>=6.0",            # Tenant/policy config and markdown frontmatter.
    # Embeddings via ONNX Runtime rather than sentence-transformers, which
    # pulls PyTorch. We only ever run inference, so several gigabytes of
    # training machinery would be dead weight in every install and CI run.
    "fastembed>=0.5",
    "neo4j>=5.20",            # Knowledge graph driver (Phase 4).
    "openfga-sdk>=0.9",       # Zanzibar-style authorization (Phase 7).
    "fastapi>=0.115",         # API layer (Phase 9).
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",             # Bearer tokens.
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",            # FastAPI's TestClient transport.
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is expressed as a call in the argument
# default. That is the framework's idiom, not the mutable-default bug the
# rule exists to catch, so the calls are declared immutable rather than the
# rule being switched off.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Header", "fastapi.Body", "fastapi.Security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragguard"]
